services:

  users-service:
    build: ./users-service
    container_name: users-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ops_user:ops_password@ops-postgres:5432/ops_db
    depends_on:
      - ops-postgres

  ops-postgres:
    image: SVDCPFCP01.mozabanco.co.mz/moza-hub-release/postgres:18.6-trixie
    container_name: ops-postgres
    environment:
      POSTGRES_DB: ops_db
      POSTGRES_USER: ops_user
      POSTGRES_PASSWORD: ops_password
    ports:
      - "5433:5432"
    volumes:
      - ops-postgres-data:/var/lib/postgresql

volumes:
  ops-postgres-data: